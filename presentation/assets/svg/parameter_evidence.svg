<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="parameter_evidence-t parameter_evidence-d" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" class="azt-fig" data-fig="parameter_evidence"><title id="parameter_evidence-t">숫자마다 근거 만들기 — 반영 강도 μ와 전환 비용 λ</title><desc id="parameter_evidence-d">μ를 0에서 4까지 바꾸면 벽에 붙인 가수 등장 비율은 4, 27, 52, 73, 82, 84%로 μ=1.0 뒤 거의 늘지 않고, 목표 도착 오차는 0.015에서 0.037로 계속 나빠져 μ=1.0을 채택. λ=0.1은 곡 간 최대 분위기 차이를 0.224에서 0.197로 줄였다.</desc><defs><marker id="parameter_evidence-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b5b5b1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="parameter_evidence-arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="parameter_evidence-arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#E8763C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="parameter_evidence-arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3F68D1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="70" y="78" font-size="25" font-weight="700" fill="#161616" text-anchor="start">벽에 붙인 가수가 추천에 나온 비율</text><rect x="434" y="110" width="88" height="410" rx="12" fill="#FBE6D9"/><text x="478" y="136" font-size="19" font-weight="700" fill="#C9581F" text-anchor="middle">채택</text><line x1="100" y1="520" x2="740" y2="520" stroke="#d8d8d6" str