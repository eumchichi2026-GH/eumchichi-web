<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="web2_safety-t web2_safety-d" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" class="azt-fig" data-fig="web2_safety"><title id="web2_safety-t">개인화를 해도 경로가 무너지지 않게</title><desc id="web2_safety-d">개인화는 기하적으로 가장 잘 맞는 밴드와 그다음 밴드(코리도어) 안에서만 곡을 바꾼다. 끄면 기존 엔진과 100% 같고, 경로와 곡 선택을 분리하며, 목표를 자동으로 옮기지 않고, 스트레스가 높으면 보수적으로, 강화학습 대신 결정식 추정을 쓴다.</desc><defs><marker id="web2_safety-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b5b5b1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="web2_safety-arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="web2_safety-arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#E8763C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="web2_safety-arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3F68D1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="70" font-size="27" font-weight="800" fill="#161616" text-anchor="start">개인화는 ‘코리도어’ 안에서만 곡을 바꾼다</text><rect x="80" y="130" width="420" height="290" rx="18" fill="#FDF3EC" stroke="#E8763C" stroke-width="2"/><text x="290" y="166" font-size="20" font-weight="700" fill="#C9581F" text-anchor="middle">코리도어 (가장 잘 맞음 + 1밴드)</text><text x="190" y="452" font-size="19" font-weight="400" fill="#6f6f6d" text-anchor="middle">가장 잘 맞음</text><line x1="300" y1="190" x2="300" y2="400" stroke="#e4e4e2" stroke-width="1.5" stroke-linecap="round"/><text x="400" y="452" font-size="19" font-weight="400" fill="#6f6f6d" text-anchor="middle">+1 밴드</text><line x1="500" y1="190" x2="500" y2="400" stroke="#E8763C" stroke-width="0" stroke-linecap="round"/><text x="590" y="452" font-size="19" font-weight="400" fill="#6f6f6d" text-anchor="middle">+2</text><line x1="680" y1="190" x2="680" y2="400" stroke="#e4e4e2" stroke-width="1.5" stroke-linecap="round"/><text x="760" y="452" font-size="19" font-weight="400" fill="#6f6f6d" text-anchor="middle">+3 이상</text><circle cx="130" cy="250" r="11" fill="#c9c9c5"/><circle cx="190" cy="340" r="11" fill="#c9c9c5"/><circle cx="240" cy="290" r="11" fill="#c9c9c5"/><circle cx="340" cy="236" r="11" fill="#c9c9c5"/><circle cx="450" cy="240" r="11" fill="#c9c9c5"/><circle cx="470" cy="380" r="11" fill="#c9c9c5"/><circle cx="540" cy="300" r="11" fill="#c9c9c5"/><circle cx="610" cy="250" r="11" fill="#c9c9c5"/><circle cx="640" cy="380" r="11" fill="#c9c9c5"/><circle cx="700" cy="300" r="11" fill="#c9c9c5"/><circle cx="800" cy="330" r="11" fill="#c9c9c5"/><circle cx="790" cy="240" r="11" fill="#c9c9c5"/><circle cx="390" cy="290" r="14" fill="#E8763C" stroke="#ffffff" stroke-width="3"/><circle cx="390" cy="290" r="24" fill="none" stroke="#E8763C" stroke-width="2.5"/><text x="390" y="344" font-size="19" font-weight="700" fill="#161616" text-anchor="middle"><tspan x="390" dy="0">내 취향 곡</tspan><tspan x="390" dy="24.7">→ 선택 가능</tspan></text><circle cx="740" cy="360" r="14" fill="#ffffff" stroke="#E8763C" stroke-width="3"/><path d="M732 352 L748 368 M748 352 L732 368" fill="none" stroke="#E8763C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="560" y="112" width="290" height="70" rx="12" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><text x="578" y="142" font-size="18" font-weight="400" fill="#161616" text-anchor="start"><tspan x="578" dy="0">취향 곡이어도 경로에서</tspan><tspan x="578" dy="24.3">멀면 고르지 않는다</tspan></text><line x1="745" y1="184" x2="741" y2="340" stroke="#b5b5b1" stroke-width="1.5" stroke-linecap="round"/><text x="460" y="496" font-size="19" font-weight="400" fill="#9a9a97" text-anchor="middle">← 감정 경로에 더 잘 맞음        덜 맞음 →</text><rect x="40" y="540" width="820" height="190" rx="18" fill="#f4f4f3"/><text x="72" y="592" font-size="23" font-weight="700" fill="#161616" text-anchor="start">걸음마다  개인 비용 = clamp( μ·취향 + 전환 비용, −J, +J )</text><text x="72" y="640" font-size="21" font-weight="400" fill="#6f6f6d" text-anchor="start"><tspan x="72" dy="0">→ 개인화가 고른 곡은 기하적으로 가장 잘 맞는 곡보다</tspan><tspan x="72" dy="31.5">   한 밴드 넘게 나빠지지 않는다 (정리로 보장)</tspan></text><rect x="920" y="40" width="640" height="124" rx="16" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><circle cx="966" cy="102" r="20" fill="#161616"/><text x="966" y="108.8" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="1004" y="94" font-size="25" font-weight="800" fill="#161616" text-anchor="start">끄면 기존 엔진과 100% 같다</text><text x="1004" y="132" font-size="19" font-weight="400" fill="#6f6f6d" text-anchor="start">회귀 1,959 시나리오 일치 · 끄는 스위치 3개</text><rect x="920" y="180" width="640" height="124" rx="16" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><circle cx="966" cy="242" r="20" fill="#161616"/><text x="966" y="248.8" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="1004" y="234" font-size="25" font-weight="800" fill="#161616" text-anchor="start">경로와 곡 선택을 분리</text><text x="1004" y="272" font-size="19" font-weight="400" fill="#6f6f6d" text-anchor="start">취향 때문에 넘긴 곡은 경로를 바꾸지 않는다</text><rect x="920" y="320" width="640" height="124" rx="16" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><circle cx="966" cy="382" r="20" fill="#161616"/><text x="966" y="388.8" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="1004" y="374" font-size="25" font-weight="800" fill="#161616" text-anchor="start">목표는 자동으로 옮기지 않는다</text><text x="1004" y="412" font-size="19" font-weight="400" fill="#6f6f6d" text-anchor="start">속도·장르·가사 등 내 선언이 모델보다 우선</text><rect x="920" y="460" width="640" height="124" rx="16" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><circle cx="966" cy="522" r="20" fill="#161616"/><text x="966" y="528.8" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="1004" y="514" font-size="25" font-weight="800" fill="#161616" text-anchor="start">스트레스가 높으면 보수적으로</text><text x="1004" y="552" font-size="19" font-weight="400" fill="#6f6f6d" text-anchor="start">새 가수 탐색 없음 · 자동으로 빨라지지 않음</text><rect x="920" y="600" width="640" height="124" rx="16" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><circle cx="966" cy="662" r="20" fill="#161616"/><text x="966" y="668.8" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="1004" y="654" font-size="25" font-weight="800" fill="#161616" text-anchor="start">강화학습 대신 결정식 추정</text><text x="1004" y="692" font-size="19" font-weight="400" fill="#6f6f6d" text-anchor="start">사용자당 1~10회 규모에 맞춘 방향 신호 학습</text></svg>
