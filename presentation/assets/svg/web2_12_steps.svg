<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="web2_12_steps-t web2_12_steps-d" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" class="azt-fig" data-fig="web2_12_steps"><title id="web2_12_steps-t">ver2(web2)에서 개인화되는 12가지 절차</title><desc id="web2_12_steps-d">입력 해석(지금·목표 좌표), 경로 설계(속도·시작점·길이·도착 후 구간), 곡 고르기(취향·곡 사이 연결·후보 거르기·다양성·더 들을 곡), 보여 주기(내 취향 모델). 경로를 바꾸는 값과 곡만 고르는 값을 분리한다.</desc><defs><marker id="web2_12_steps-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b5b5b1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="web2_12_steps-arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="web2_12_steps-arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#E8763C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="web2_12_steps-arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3F68D1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="72" font-size="27" font-weight="800" fill="#161616" text-anchor="start">① 입력 해석</text><line x1="346" y1="64" x2="372" y2="64" stroke="#b5b5b1" stroke-width="2.5" stroke-linecap="round" marker-end="url(#web2_12_steps-arr)"/><rect x="40" y="104" width="300" height="94" rx="14" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><rect x="40" y="104" width="8" height="94" rx="4" fill="#3F68D1"/><circle cx="82" cy="138" r="16" fill="#3F68D1"/><text x="82" y="143.8" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="110" y="146" font-size="23" font-weight="700" fill="#161616" text-anchor="start">지금 기분 좌표</text><text x="66" y="180" font-size="17.5" font-weight="400" fill="#6f6f6d" text-anchor="start">내가 끌어 옮긴 위치</text><rect x="40" y="212" width="300" height="94" rx="14" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><rect x="40" y="212" width="8" height="94" rx="4" fill="#3F68D1"/><circle cx="82" cy="246" r="16" fill="#3F68D1"/><text x="82" y="251.8" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="110" y="254" font-size="23" font-weight="700" fill="#161616" text-anchor="start">목표 좌표</text><text x="66" y="288" font-size="17.5" font-weight="400" fill="#6f6f6d" text-anchor="start">끌어 옮긴 만큼만 (자동 이동 없음)</text><text x="380" y="72" font-size="27" font-weight="800" fill="#161616" text-anchor="start">② 경로 설계</text><line x1="726" y1="64" x2="752" y2="64" stroke="#b5b5b1" stroke-width="2.5" stroke-linecap="round" marker-end="url(#web2_12_steps-arr)"/><rect x="380" y="104" width="340" height="94" rx="14" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><rect x="380" y="104" width="8" height="94" rx="4" fill="#3F68D1"/><circle cx="422" cy="138" r="16" fill="#3F68D1"/><text x="422" y="143.8" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="450" y="146" font-size="23" font-weight="700" fill="#161616" text-anchor="start">경로 속도</text><text x="406" y="180" font-size="17.5" font-weight="400" fill="#6f6f6d" text-anchor="start">속도 버튼 · ‘더 빨리/천천히’</text><rect x="380" y="212" width="340" height="94" rx="14" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><rect x="380" y="212" width="8" height="94" rx="4" fill="#3F68D1"/><circle cx="422" cy="246" r="16" fill="#3F68D1"/><text x="422" y="251.8" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="450" y="254" font-size="23" font-weight="700" fill="#161616" text-anchor="start">시작점</text><text x="406" y="288" font-size="17.5" font-weight="400" fill="#6f6f6d" text-anchor="start">첫 곡 넘김 · ‘기분과 달라요’</text><rect x="380" y="320" width="340" height="94" rx="14" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><rect x="380" y="320" width="8" height="94" rx="4" fill="#3F68D1"/><circle cx="422" cy="354" r="16" fill="#3F68D1"/><text x="422" y="359.8" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="450" y="362" font-size="23" font-weight="700" fill="#161616" text-anchor="start">감상 길이</text><text x="406" y="396" font-size="17.5" font-weight="400" fill="#6f6f6d" text-anchor="start">‘길었어요 / 짧았어요’</text><rect x="380" y="428" width="340" height="94" rx="14" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><rect x="380" y="428" width="8" height="94" rx="4" fill="#3F68D1"/><circle cx="422" cy="462" r="16" fill="#3F68D1"/><text x="422" y="467.8" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="450" y="470" font-size="23" font-weight="700" fill="#161616" text-anchor="start">도착 후 구간</text><text x="406" y="504" font-size="17.5" font-weight="400" fill="#6f6f6d" text-anchor="start">‘끝 분위기 달라요’ · ‘너무 자주’</text><text x="760" y="72" font-size="27" font-weight="800" fill="#161616" text-anchor="start">③ 곡 고르기</text><line x1="1186" y1="64" x2="1212" y2="64" stroke="#b5b5b1" stroke-width="2.5" stroke-linecap="round" marker-end="url(#web2_12_steps-arr)"/><rect x="760" y="104" width="420" height="94" rx="14" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><rect x="760" y="104" width="8" height="94" rx="4" fill="#E8763C"/><circle cx="802" cy="138" r="16" fill="#E8763C"/><text x="802" y="143.8" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="830" y="146" font-size="23" font-weight="700" fill="#161616" text-anchor="start">곡 취향</text><text x="786" y="180" font-size="17.5" font-weight="400" fill="#6f6f6d" text-anchor="start">좋아요 · 싫어요 · 벽 · 청취 시간</text><rect x="760" y="212" width="420" height="94" rx="14" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><rect x="760" y="212" width="8" height="94" rx="4" fill="#E8763C"/><circle cx="802" cy="246" r="16" fill="#E8763C"/><text x="802" y="251.8" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">8</text><text x="830" y="254" font-size="23" font-weight="700" fill="#161616" text-anchor="start">곡 사이 연결</text><text x="786" y="288" font-size="17.5" font-weight="400" fill="#6f6f6d" text-anchor="start">전환 직후 넘김 (취향 몫은 뺌)</text><rect x="760" y="320" width="420" height="94" rx="14" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><rect x="760" y="320" width="8" height="94" rx="4" fill="#E8763C"/><circle cx="802" cy="354" r="16" fill="#E8763C"/><text x="802" y="359.8" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">9</text><text x="830" y="362" font-size="23" font-weight="700" fill="#161616" text-anchor="start">후보 거르기</text><text x="786" y="396" font-size="17.5" font-weight="400" fill="#6f6f6d" text-anchor="start">‘가사·목소리가 거슬려요’</text><rect x="760" y="428" width="420" height="94" rx="14" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><rect x="760" y="428" width="8" height="94" rx="4" fill="#E8763C"/><circle cx="802" cy="462" r="16" fill="#E8763C"/><text x="802" y="467.8" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">10</text><text x="830" y="470" font-size="23" font-weight="700" fill="#161616" text-anchor="start">다양성</text><text x="786" y="504" font-size="17.5" font-weight="400" fill="#6f6f6d" text-anchor="start">‘너무 자주 나와요’ · 노출 기록</text><rect x="760" y="536" width="420" height="94" rx="14" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><rect x="760" y="536" width="8" height="94" rx="4" fill="#E8763C"/><circle cx="802" cy="570" r="16" fill="#E8763C"/><text x="802" y="575.8" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">11</text><text x="830" y="578" font-size="23" font-weight="700" fill="#161616" text-anchor="start">더 들을 곡</text><text x="786" y="612" font-size="17.5" font-weight="400" fill="#6f6f6d" text-anchor="start">위 모든 값으로 엔진이 고름</text><text x="1220" y="72" font-size="27" font-weight="800" fill="#161616" text-anchor="start">④ 보여 주기</text><rect x="1220" y="104" width="340" height="94" rx="14" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><rect x="1220" y="104" width="8" height="94" rx="4" fill="#161616"/><circle cx="1262" cy="138" r="16" fill="#161616"/><text x="1262" y="143.8" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">12</text><text x="1290" y="146" font-size="23" font-weight="700" fill="#161616" text-anchor="start">「내 취향 모델」</text><text x="1246" y="180" font-size="17.5" font-weight="400" fill="#6f6f6d" text-anchor="start">이번 추천에 반영된 나 · 기본 추천과 비교</text><rect x="1220" y="230" width="340" height="170" rx="16" fill="#FDF3EC"/><text x="1246" y="278" font-size="22" font-weight="700" fill="#161616" text-anchor="start"><tspan x="1246" dy="0">들을수록 기록이 쌓이고</tspan><tspan x="1246" dy="31.9">다음 추천에 다시 반영된다</tspan></text><text x="1246" y="370" font-size="19" font-weight="700" fill="#C9581F" text-anchor="start">쓸수록 나를 아는 추천</text><path d="M1390 402 V690 H190 V330" fill="none" stroke="#E8763C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#web2_12_steps-arrA)"/><rect x="40" y="742" width="26" height="12" rx="4" fill="#3F68D1"/><text x="76" y="754" font-size="20" font-weight="400" fill="#161616" text-anchor="start">경로를 바꾸는 값 (1–6)</text><rect x="340" y="742" width="26" height="12" rx="4" fill="#E8763C"/><text x="376" y="754" font-size="20" font-weight="400" fill="#161616" text-anchor="start">곡만 고르는 값 (7–11) — 취향은 경로를 바꾸지 않는다</text></svg>
