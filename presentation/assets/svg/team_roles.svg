<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="team_roles-t team_roles-d" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" class="azt-fig" data-fig="team_roles"><title id="team_roles-t">팀 음치치 — 역할 분담</title><desc id="team_roles-d">김서진(앱 기능·모바일), 박혜빈(UI·개인화), 정다솔(연구·설문), 황지민(데이터·모델). 회의록 기준.</desc><defs><marker id="team_roles-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b5b5b1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="team_roles-arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="team_roles-arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#E8763C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="team_roles-arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3F68D1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="90" width="360" height="580" rx="22" fill="#fafaf9" stroke="#e4e4e2" stroke-width="1.5"/><circle cx="110" cy="170" r="38" fill="#161616"/><text x="110" y="182" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">서진</text><text x="72" y="270" font-size="38" font-weight="800" fill="#161616" text-anchor="start">김서진</text><rect x="72" y="296" width="158.8" height="33.3" rx="16.625" fill="#ffffff" stroke="#d8d8d6" stroke-width="1.5"/><text x="151.4" y="319.5" font-size="19" font-weight="600" fill="#