<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="survey_to_redesign-t survey_to_redesign-d" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" class="azt-fig" data-fig="survey_to_redesign"><title id="survey_to_redesign-t">사용 후기 설문이 바꾼 것</title><desc id="survey_to_redesign-d">설문 의견별로 fix-web 재설계와 ver2(web2)에서 무엇을 바꿨는지 보여 준다.</desc><defs><marker id="survey_to_redesign-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b5b5b1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="survey_to_redesign-arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="survey_to_redesign-arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#E8763C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="survey_to_redesign-arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3F68D1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="66" font-size="24" font-weight="700" fill="#6f6f6d" text-anchor="start">사용 후기 설문에서 나온 말</text><text x="626" y="66" font-size="24" font-weight="700" fill="#6f6f6d" text-anchor="start">fix-web 재설계</text><rect x="1130" y="44" width="8" height="30" rx="3" fill="#E8763C"/><text x="1150" y="66" font-size="24" font-weight="700" fill="#161616" text-anchor="start">ver2 (web2)</text><rect x="40" y="96" width="520" height="108" rx="16" fill="#f4f4f3"/><text x="68" y="172" font-size="58" font-weight="800" fill="#E8763C" text-anchor="start">“</text><text x="112" y="159" font-size="25" font-weight="600" fill="#161616" text-anchor="start">AI가 내 감정을 정확히 못 읽어요</text><line x1="568" y1="150" x2="616" y2="150" stroke="#b5b5b1" stroke-width="2.5" stroke-linecap="round" marker-end="url(#survey_to_redesign-arr)"/><rect x="626" y="96" width="440" height="108" rx="16" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><text x="654" y="158" font-size="22" font-weight="400" fill="#161616" text-anchor="start">자연어 입력 해석 개선</text><line x1="1074" y1="150" x2="1122" y2="150" stroke="#E8763C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#survey_to_redesign-arrA)"/><rect x="1130" y="96" width="430" height="108" rx="16" fill="#FDF3EC" stroke="#E8763C" stroke-width="1.5"/><text x="1158" y="142" font-size="22" font-weight="400" fill="#161616" text-anchor="start"><tspan x="1158" dy="0">좌표를 직접 끌어 옮기기</tspan><tspan x="1158" dy="31.9">+ 내 감정 단어 좌표 학습</tspan></text><rect x="40" y="220" width="520" height="108" rx="16" fill="#f4f4f3"/><text x="68" y="296" font-size="58" font-weight="800" fill="#E8763C" text-anchor="start">“</text><text x="112" y="283" font-size="25" font-weight="600" fill="#161616" text-anchor="start">곡 분위기가 오락가락해요</text><line x1="568" y1="274" x2="616" y2="274" stroke="#b5b5b1" stroke-width="2.5" stroke-linecap="round" marker-end="url(#survey_to_redesign-arr)"/><rect x="626" y="220" width="440" height="108" rx="16" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><text x="654" y="266" font-size="22" font-weight="400" fill="#161616" text-anchor="start"><tspan x="654" dy="0">전환 비용 λ = 0.1</tspan><tspan x="654" dy="31.9">도착 구간 정렬</tspan></text><line x1="1074" y1="274" x2="1122" y2="274" stroke="#E8763C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#survey_to_redesign-arrA)"/><rect x="1130" y="220" width="430" height="108" rx="16" fill="#FDF3EC" stroke="#E8763C" stroke-width="1.5"/><text x="1158" y="266" font-