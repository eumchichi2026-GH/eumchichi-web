inecap="round" marker-end="url(#survey_to_redesign-arrA)"/><rect x="1130" y="468" width="430" height="108" rx="16" fill="#FDF3EC" stroke="#E8763C" stroke-width="1.5"/><text x="1158" y="514" font-size="22" font-weight="400" fill="#161616" text-anchor="start"><tspan x="1158" dy="0">‘목소리가 거슬려요’ 기록 →</tspan><tspan x="1158" dy="31.9">말 많은 곡 자동 제외</tspan></text><rect x="40" y="592" width="520" height="108" rx="16" fill="#f4f4f3"/><text x="68" y="668" font-size="58" font-weight="800" fill="#E8763C" text-anchor="start">“</text><text x="112" y="655" font-size="25" font-weight="600" fill="#161616" text-anchor="start">추천 곡이 마음에 안 들어요</text><line x1="568" y1="646" x2="616" y2="646" stroke="#b5b5b1" stroke-width="2.5" stroke-linecap="round" marker-end="url(#survey_to_redesign-arr)"/><rect x="626" y="592" width="440" height="108" rx="16" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><text x="654" y="638" font-size="22" font-weight="400" fill="#161616" text-anchor="start"><tspan x="654" dy="0">좋아요 비율 개인화</tspan><tspan x="654" dy="31.9">반영 강도 μ = 1.0 (실험)</tspan></text><line x1="1074" y1="646" x2="1122" y2="646" stroke="#E8763C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#survey_to_redesign-arrA)"/><rect x="1130" y="592" width="430" height="108" rx="16" fill="#FDF3EC" stroke="#E8763C" stroke-width="1.5"/><text x="1158" y="638" font-size="22" font-weight="400" fill="#161616" text-anchor="start"><tspan x="1158" dy="0">플레이리스트를 만드는</tspan><tspan x="1158" dy="31.9"><tspan font-weight="700">12가지 절차 전면 개인화</tspan></tspan></text><text x="40" y="770" font-size="19" font-weight="400" fill="#9a9a97" text-anchor="start">응답 요지(원문 줄임) · AZT 사용 후기 설문 2026.9.15–21, n=22 · 가장 낮은 점수: ‘첫 곡이 기분과 맞았다’ 3.8 · ‘원하는 상태로 옮겨 가는 느낌’ 3.8 (5점)</text></svg>
