값을</tspan><tspan x="998" dy="29">전체 순위로 펼침</tspan></text><line x1="998" y1="596" x2="1222" y2="596" stroke="#e4e4e2" stroke-width="1.5" stroke-linecap="round"/><text x="998" y="650" font-size="30" font-weight="800" fill="#161616" text-anchor="start">0 ~ 1 균등</text><line x1="1254" y1="525" x2="1276" y2="525" stroke="#b5b5b1" stroke-width="2.5" stroke-linecap="round" marker-end="url(#data_pipeline-arr)"/><rect x="1280" y="360" width="280" height="330" rx="18" fill="#fafaf9" stroke="#e4e4e2" stroke-width="1.5"/><circle cx="1322" cy="406" r="19" fill="#161616"/><text x="1322" y="412.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="1308" y="478" font-size="26" font-weight="700" fill="#161616" text-anchor="start">태그 · 장르 · 길이</text><text x="1308" y="522" font-size="20" font-weight="400" fill="#6f6f6d" text-anchor="start"><tspan x="1308" dy="0">연주곡 판정 99곡 보정</tspan><tspan x="1308" dy="29">장르 13개 대분류</tspan></text><line x1="1308" y1="596" x2="1532" y2="596" stroke="#e4e4e2" stroke-width="1.5" stroke-linecap="round"/><text x="1308" y="650" font-size="30" font-weight="800" fill="#161616" text-anchor="start">연주곡 700</text><text x="40" y="760" font-size="19" font-weight="400" fill="#9a9a97" text-anchor="start">가사 곡 3,417 · 연주곡 700 · 전곡 재생 길이 반영 (2026.9.30) · 비상업 라이선스·원본 오디오 부재로 오디오 모델 대신 특징 기반 유지 (9/14 결정)</text></svg>
