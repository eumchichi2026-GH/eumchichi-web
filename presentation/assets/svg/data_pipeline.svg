<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="data_pipeline-t data_pipeline-d" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" class="azt-fig" data-fig="data_pipeline"><title id="data_pipeline-t">4,117곡 감정 데이터를 만든 과정</title><desc id="data_pipeline-d">곡 수 245 → 2,398 → 4,117곡. Spotify 특징 → 골드셋 249곡(쌍비교 964쌍) → Gemini 가사 감정 1,768곡 → 백분위 정규화 → 태그·장르·길이(장르 13, 연주곡 700, 가사 곡 3,417).</desc><defs><marker id="data_pipeline-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b5b5b1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="data_pipeline-arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="data_pipeline-arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#E8763C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="data_pipeline-arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3F68D1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="70" font-size="22" font-weight="700" fill="#6f6f6d" text-anchor="start">곡 데이터베이스</text><text x="220" y="133" font-size="23" font-weight="400" fill="#6f6f6d" text-anchor="end">시작</text><path d="M240 108H293.9Q301.9 108 301.9 116V136Q301.9 144 293.9 144H240Z" fill="#c9c9c5"/><text x="317.9" y="136" font-size="24" font-weight="700" fill="#6f6f6d" text-anchor="start">245곡</text><text x="220" y="199" font-size="23"