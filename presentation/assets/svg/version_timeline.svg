<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="version_timeline-t version_timeline-d" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" class="azt-fig" data-fig="version_timeline"><title id="version_timeline-t">개발 과정 — v1에서 ver2까지</title><desc id="version_timeline-d">7월 전문가 자문, 8월 감정 데이터 구축, 8/16 엔진 v2, 9/14 가중치 근거 문제 제기, 9/15–21 v1 배포와 사용 후기 설문, 9/20–28 fix-web 재설계, 9/27–30 ver2(web2), 10/7 최종 발표.</desc><defs><marker id="version_timeline-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b5b5b1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="version_timeline-arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="version_timeline-arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#E8763C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="version_timeline-arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3F68D1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><line x1="60" y1="400" x2="1540" y2="400" stroke="#d8d8d6" stroke-width="3" stroke-linecap="round"/><rect x="520" y="394" width="390" height="12" rx="6" fill="#b5b5b1"/><rect x="930" y="394" width="190" height="12" rx="6" fill="#161616"/><rect x="1180" y="394" width="250" height="12" rx="6" fill="#E8763C"/><line x1="200" y1="316" x2="200" y2="388" stroke="#d8d8d6" stroke-width="2" stroke-linecap="round"/><rect x="40" y="96" width="320" height="220" rx="16" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><text x="64" y="138" font-size="21" font-weight="700" fill="#6f6f6d" text-anchor="start">7월</text><text x="64" y="180" font-size="24" font-weight="800" fill="#161616" text-anchor="start">전문가 자문</text><text x="64" y="226" font-size="18" font-weight="400" fill="#6f6f6d" text-anchor="start"><tspan x="64" dy="0">음악중재전문가 “핵심은 선호 음악”</tspan><tspan x="64" dy="27.9">→ ISO 순차 추천 · 취향 조사</tspan></text><circle cx="200" cy="400" r="11" fill="#161616" stroke="#ffffff" stroke-width="3"/><line x1="370" y1="412" x2="370" y2="484" stroke="#d8d8d6" stroke-width="2" stroke-linecap="round"/><rect x="210" y="484" width="320" height="220" rx="16" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><text x="234" y="526" font-size="21" font-weight="700" fill="#6f6f6d" text-anchor="start">8월</text><text x="234" y="568" font-size="24" font-weight="800" fill="#161616" text-anchor="start">감정 데이터 구축</text><text x="234" y="614" font-size="18" font-weight="400" fill="#6f6f6d" text-anchor="start"><tspan x="234" dy="0">골드셋으로 한국 곡 V 오차 발견</tspan><tspan x="234" dy="27.9">→ Gemini 가사 보정식</tspan></text><circle cx="370" cy="400" r="11" fill="#161616" stroke="#ffffff" stroke-width="3"/><line x1="540" y1="316" x2="540" y2="388" stroke="#d8d8d6" stroke-width="2" stroke-linecap="round"/><rect x="380" y="96" width="320" height="220" rx="16" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><text x="404" y="138" font-size="21" font-weight="700" fill="#6f6f6d" text-anchor="start">8/16</text><text x="404" y="180" font-size="24" font-weight="800" fill="#161616" text-anchor="start">추천 엔진 v2</text><text x="404" y="226" font-size="18" font-weight="400" fill="#6f6f6d" text-anchor="start"><tspan x="404" dy="0">그리디 → 빔 서치</tspan><tspan x="404" dy="27.9">도착 오차 −63% · 반복 20% → 0%</tspan></text><circle cx="540" cy="400" r="11" fill="#161616" stroke="#ffffff" stroke-width="3"/><line x1="710" y1="412" x2="710" y2="484" stroke="#d8d8d6" stroke-width="2" stroke-linecap="round"/><rect x="550" y="484" width="320" height="220" rx="16" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><text x="574" y="526" font-size="21" font-weight="700" fill="#6f6f6d" text-anchor="start">9/14</text><text x="574" y="568" font-size="24" font-weight="800" fill="#161616" text-anchor="start">“가중치에 근거가 없다”</text><text x="574" y="614" font-size="18" font-weight="400" fill="#6f6f6d" text-anchor="start"><tspan x="574" dy="0">회의에서 문제 제기</tspan><tspan x="574" dy="27.9">→ 기록으로 성장하는 개인화로</tspan></text><circle cx="710" cy="400" r="11" fill="#161616" stroke="#ffffff" stroke-width="3"/><line x1="880" y1="316" x2="880" y2="388" stroke="#d8d8d6" stroke-width="2" stroke-linecap="round"/><rect x="720" y="96" width="320" height="220" rx="16" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><text x="744" y="138" font-size="21" font-weight="700" fill="#6f6f6d" text-anchor="start">9/15–21</text><text x="744" y="180" font-size="24" font-weight="800" fill="#161616" text-anchor="start">v1 배포 · 사용 후기 설문</text><text x="744" y="226" font-size="18" font-weight="400" fill="#6f6f6d" text-anchor="start"><tspan x="744" dy="0">실사용 36명 · 추천 71건</tspan><tspan x="744" dy="27.9">사용 후기 설문 22명</tspan></text><circle cx="880" cy="400" r="11" fill="#161616" stroke="#ffffff" stroke-width="3"/><line x1="1050" y1="412" x2="1050" y2="484" stroke="#d8d8d6" stroke-width="2" stroke-linecap="round"/><rect x="890" y="484" width="320" height="220" rx="16" fill="#ffffff" stroke="#e4e4e2" stroke-width="1.5"/><text x="914" y="526" font-size="21" font-weight="700" fill="#6f6f6d" text-anchor="start">9/20–28</text><text x="914" y="568" font-size="24" font-weight="800" fill="#161616" text-anchor="start">fix-web 재설계</text><text x="914" y="614" font-size="18" font-weight="400" fill="#6f6f6d" text-anchor="start"><tspan x="914" dy="0">4,117곡 · λ·μ 민감도 실험</tspan><tspan x="914" dy="27.9">장르 규칙 · 연주곡 판정 보정</tspan></text><circle cx="1050" cy="400" r="11" fill="#161616" stroke="#ffffff" stroke-width="3"/><line x1="1220" y1="316" x2="1220" y2="388" stroke="#d8d8d6" stroke-width="2" stroke-linecap="round"/><rect x="1060" y="96" width="320" height="220" rx="16" fill="#FDF3EC" stroke="#E8763C" stroke-width="1.5"/><text x="1084" y="138" font-size="21" font-weight="700" fill="#C9581F" text-anchor="start">9/27–30</text><text x="1084" y="180" font-size="24" font-weight="800" fill="#161616" text-anchor="start">ver2 (web2)</text><text x="1084" y="226" font-size="18" font-weight="400" fill="#6f6f6d" text-anchor="start"><tspan x="1084" dy="0">12가지 절차 전면 개인화</tspan><tspan x="1084" dy="27.9">합성 사용자 검증 · main 병합</tspan></text><circle cx="1220" cy="400" r="11" fill="#E8763C" stroke="#ffffff" stroke-width="3"/><line x1="1390" y1="412" x2="1390" y2="484" stroke="#d8d8d6" stroke-width="2" stroke-linecap="round"/><rect x="1230" y="484" width="320" height="220" rx="16" fill="#FDF3EC" stroke="#E8763C" stroke-width="1.5"/><text x="1254" y="526" font-size="21" font-weight="700" fill="#C9581F" text-anchor="start">10/7</text><text x="1254" y="568" font-size="24" font-weight="800" fill="#161616" text-anchor="start">최종 발표</text><text x="1254" y="614" font-size="18" font-weight="400" fill="#6f6f6d" text-anchor="start"><tspan x="1254" dy="0">시연: 문장 한 줄 →</tspan><tspan x="1254" dy="27.9">나에게 맞춘 감정 경로</tspan></text><circle cx="1390" cy="400" r="11" fill="#E8763C" stroke="#ffffff" stroke-width="3"/><rect x="40" y="754" width="34" height="12" rx="6" fill="#b5b5b1"/><text x="86" y="766" font-size="20" font-weight="400" fill="#6f6f6d" text-anchor="start">v1 · 설문 배포판</text><rect x="270.4" y="754" width="34" height="12" rx="6" fill="#161616"/><text x="316.4" y="766" font-size="20" font-weight="400" fill="#6f6f6d" text-anchor="start">fix-web · 설문 기반 재설계</text><rect x="596.2" y="754" width="34" height="12" rx="6" fill="#E8763C"/><text x="642.2" y="766" font-size="20" font-weight="400" fill="#6f6f6d" text-anchor="start">ver2 (web2) · 최종 서비스</text></svg>
