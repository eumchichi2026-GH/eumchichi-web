<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="expected_effects-t expected_effects-d" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" class="azt-fig" data-fig="expected_effects"><title id="expected_effects-t">기대효과와 확장 가능성</title><desc id="expected_effects-d">사전 설문: 사용 의향 84%, 유료 지불 의사 56%(그중 30%는 월 3천 원 이상), 피드백 반영 기능 희망 78%(가장 원하는 기능 1위, 이미 구현). 확장: 캠퍼스 스트레스 자기관리, 구독형·플랫폼 연동, 스마트워치 생체신호, 상황 정보·다른 세대.</desc><defs><marker id="expected_effects-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b5b5b1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="expected_effects-arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="expected_effects-arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#E8763C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="expected_effects-arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3F68D1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="70" font-size="22" font-weight="700" fill="#6f6f6d" text-anchor="start">수요</text><circle cx="160" cy="230" r="96" fill="none" stroke="#FBE6D9" stroke-width="22"/><circle cx="160" cy="230" r="96" fill="none" stroke="#E8763C" stroke-width="22" stroke-linecap="round" pathLength="100" stroke-dasharray="84 100" transform="rotate(-90 160 230)"/><text x="160" y="252" text-anchor="middle" font-size="62" font-weight="800" fill="#161616">84<tspan font-size="30" font-weight="700" dx="3">%</tspan></text><text x="160" y="380" font-size="23" font-weight="700" fill="#161616" text-anchor="middle">서비스 사용 의향</text><circle cx="410" cy="230" r="96" fill="none" stroke="#FBE6D9" stroke-width="22"/><circle cx="410" cy="230" r="96" fill="none" stroke="#E8763C" stroke-width="22" stroke-linecap="round" pathLength="100" stroke-dasharray="56 100" transform="rotate(-90 410 230)"/><text x="410" y="252" text-anchor="middle" font-size="62" font-weight="800" fill="#161616">56<tspan font-size="30" font-weight="700" dx="3">%</tspan></text><text x="410" y="380" font-size="23" font-weight="700" fill="#161616" text-anchor="middle">유료 지불 의사</text><text x="410" y="414" font-size="17" font-weight="400" fill="#6f6f6d" text-anchor="middle">그중 30%는 월 3천 원 이상</text><circle cx="660" cy="230" r="96" fill="none" stroke="#FBE6D9" stroke-width="22"/><circle cx="660" cy="230" r="96" fill="none" stroke="#E8763C" stroke-width="22" stroke-linecap="round" pathLength="100" stroke-dasharray="78 100" transform="rotate(-90 660 230)"/><text x="660" y="252" text-anchor="middle" font-size="62" font-weight="800" fill="#161616">78<tspan font-size="30" font-weight="700" dx="3">%</tspan></text><text x="660" y="380" font-size="23" font-weight="700" fill="#161616" text-anchor="middle">‘피드백 반영’ 희망</text><text x="660" y="414" font-size="17" font-weight="400" fill="#6f6f6d" text-anchor="middle">원하는 기능 1위 — 이미 구현</text><rect x="40" y="480" width="740" height="210" rx="20" fill="#f4f4f3"/><text x="76" y="540" font-size="60" font-weight="800" fill="#E8763C" text-anchor="start">“</text><text x="118" y="538" font-size="23" font-weight="600" fill="#161616" text-anchor="start"><tspan x="118" dy="0">감정 단어를 고르는 입력 방식이</tspan><tspan x="118" dy="34.5">상담 현장의 ‘감정단어 카드’ 기법과 맞는다</tspan></text><text x="118" y="650" font-size="17" font-weight="400" fill="#6f6f6d" text-anchor="start">— 학생상담센터 책임상담원 자문 · 상담을 대신하지 않고 상담 사이사이 쓰는 도구</text><text x="860" y="70" font-size="22" font-weight="700" fill="#6f6f6d" text-anchor="start">활용과 확장</text><line x1="902" y1="140" x2="902" y2="640" stroke="#d8d8d6" stroke-width="3" stroke-linecap="round"/><circle cx="902" cy="140" r="22" fill="#E8763C"/><text x="902" y="147.2" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="946" y="149" font-size="26" font-weight="800" fill="#161616" text-anchor="start">캠퍼스 스트레스 자기관리</text><text x="946" y="188" font-size="19" font-weight="400" fill="#6f6f6d" text-anchor="start">시험 · 과제 마감 시기 · 고위험 시 전문기관(109 등) 안내</text><circle cx="902" cy="306" r="22" fill="#161616"/><text x="902" y="313.2" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="946" y="315" font-size="26" font-weight="800" fill="#161616" text-anchor="start">구독형 · 음악 플랫폼 연동</text><text x="946" y="354" font-size="19" font-weight="400" fill="#6f6f6d" text-anchor="start">유료 지불 의사 56% · 플레이리스트 저장 확대</text><circle cx="902" cy="472" r="22" fill="#161616"/><text x="902" y="479.2" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="946" y="481" font-size="26" font-weight="800" fill="#161616" text-anchor="start">스마트워치 생체신호</text><text x="946" y="520" font-size="19" font-weight="400" fill="#6f6f6d" text-anchor="start">심박 변이(HRV)로 입력 없이 지금 상태 측정</text><circle cx="902" cy="638" r="22" fill="#161616"/><text x="902" y="645.2" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="946" y="647" font-size="26" font-weight="800" fill="#161616" text-anchor="start">상황 정보 · 다른 세대</text><text x="946" y="686" font-size="19" font-weight="400" fill="#6f6f6d" text-anchor="start">날씨 · 시간 · 일정 반영 · 노년층 회상 음악</text><text x="40" y="770" font-size="19" font-weight="400" fill="#9a9a97" text-anchor="start">대학생 음악 이용자 대상 자체 설문 (2026.8, n=73) · 자문 의견 · 치료 효과를 확정한 결과가 아님</text></svg>
