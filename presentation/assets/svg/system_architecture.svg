<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="system_architecture-t system_architecture-d" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" class="azt-fig" data-fig="system_architecture"><title id="system_architecture-t">AZT 서비스 구조와 AI 활용 위치</title><desc id="system_architecture-d">입력 → Gemini 자연어 해석 → ISO 경로 엔진 → 재생·저장. 엔진은 곡 데이터(Gemini 가사 점수 포함)와 개인 모델을 받고, 피드백은 Gemini로 분류돼 개인 모델로 돌아간다. LLM은 변환만, 곡 순서는 수식이 정한다.</desc><defs><marker id="system_architecture-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b5b5b1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="system_architecture-arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="system_architecture-arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#E8763C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="system_architecture-arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3F68D1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="140" width="300" height="210" rx="18" fill="#ffffff" stroke="#d8d8d6" stroke-width="2"/><text x="68" y="192" font-size="28" font-weight="700" fill="#161616" text-anchor="start">입력</text><text x="68" y="236" font-size="21" font-weight="400" fill="#6f6f6d" text-anchor="start"><tspan x="68" dy="0">문장 · 감정 칩</tspan><tspan x="68" dy="30.5">좌표 직접 끌기 (ver2)</tspan></text><rect x="410" y="140" width="330" height="210" rx="18" fill="#ffffff" stroke="#d8d8d6" stroke-width="2"/><text x="438" y="192" font-size="28" font-weight="700" fill="#161616" text-anchor="start">자연어 해석</text><text x="438" y="236" font-size="21" font-weight="400" fill="#6f6f6d" text-anchor="start"><tspan x="438" dy="0">문장 → 지금 · 목표 좌표</tspan><tspan x="438" dy="30.5">장르 · 가사 조건 추출</tspan></text><rect x="637.4" y="162" width="82.6" height="29.8" rx="14.875" fill="#E8763C"/><text x="678.7" y="183" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Gemini</text><rect x="810" y="140" width="380" height="210" rx="18" fill="#161616"/><text x="838" y="192" font-size="28" font-weight="700" fill="#ffffff" text-anchor="start">ISO 경로 엔진</text><text x="838" y="236" font-size="21" font-weight="400" fill="#d9d9d6" text-anchor="start"><tspan x="838" dy="0">빔 서치 · 비용이 가장 작은 경로</tspan><tspan x="838" dy="30.5">거리 + 역행 벌점</tspan><tspan x="838" dy="30.5">+ 전환 비용 λ + 취향 비용 μ</tspan></text><rect x="1260" y="140" width="300" height="210" rx="18" fill="#ffffff" stroke="#d8d8d6" stroke-width="2"/><text x="1288" y="192" font-size="28" font-weight="700" fill="#161616" text-anchor="start">재생 · 저장</text><text x="1288" y="236" font-size="21" font-weight="400" fill="#6f6f6d" text-anchor="start"><tspan x="1288" dy="0">Spotify 연속 재생</tspan><tspan x="1288" dy="30.5">YouTube Music · Spotify</tspan><tspan x="1288" dy="30.5">플레이리스트로 가져가기</tspan></text><line x1="342" y1="245" x2="402" y2="245" stroke="#b5b5b1" stroke-width="3" stroke-linecap="round" marker-end="url(#system_architecture-arr)"/><line x1="742" y1="245" x2="802" y2="245" stroke="#b5b5b1" stroke-width="3" stroke-linecap="round" marker-end="url(#system_architecture-arr)"/><line x1="1192" y1="245" x2="1252" y2="245" stroke="#b5b5b1" stroke-width="3" stroke-linecap="round" marker-end="url(#system_architecture-arr)"/><rect x="520" y="470" width="400" height="200" rx="18" fill="#fafaf9" stroke="#d8d8d6" stroke-width="2"/><text x="548" y="522" font-size="28" font-weight="700" fill="#161616" text-anchor="start">곡 데이터 4,117곡</text><text x="548" y="566" font-size="21" font-weight="400" fill="#6f6f6d" text-anchor="start"><tspan x="548" dy="0">V·A 감정 좌표 · 태그 · 장르 · 길이</tspan><tspan x="548" dy="30.5">가사 감정 점수 1,768곡</tspan></text><rect x="817.4" y="492" width="82.6" height="29.8" rx="14.875" fill="#E8763C"/><text x="858.7" y="513" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Gemini</text><rect x="980" y="470" width="250" height="200" rx="18" fill="#FDF3EC" stroke="#E8763C" stroke-width="2"/><text x="1008" y="522" font-size="28" font-weight="700" fill="#161616" text-anchor="start">개인 모델</text><text x="1008" y="566" font-size="21" font-weight="400" fill="#6f6f6d" text-anchor="start"><tspan x="1008" dy="0">기록 → 내 정책</tspan><tspan x="1008" dy="30.5">12가지 절차 (ver2)</tspan></text><rect x="1290" y="470" width="270" height="200" rx="18" fill="#fafaf9" stroke="#d8d8d6" stroke-width="2"/><text x="1318" y="522" font-size="28" font-weight="700" fill="#161616" text-anchor="start">피드백</text><text x="1318" y="566" font-size="21" font-weight="400" fill="#6f6f6d" text-anchor="start"><tspan x="1318" dy="0">좋아요 · 싫어요 · 벽</tspan><tspan x="1318" dy="30.5">청취 시간 · 한 줄 기록</tspan></text><rect x="1457.4" y="492" width="82.6" height="29.8" rx="14.875" fill="#E8763C"/><text x="1498.7" y="513" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Gemini</text><line x1="860" y1="468" x2="860" y2="360" stroke="#b5b5b1" stroke-width="3" stroke-linecap="round" marker-end="url(#system_architecture-arr)"/><line x1="1105" y1="468" x2="1105" y2="360" stroke="#E8763C" stroke-width="3" stroke-linecap="round" marker-end="url(#system_architecture-arrA)"/><line x1="1410" y1="352" x2="1410" y2="462" stroke="#b5b5b1" stroke-width="3" stroke-linecap="round" marker-end="url(#system_architecture-arr)"/><line x1="1288" y1="570" x2="1240" y2="570" stroke="#E8763C" stroke-width="3" stroke-linecap="round" marker-end="url(#system_architecture-arrA)"/><text x="1424" y="418" font-size="18" font-weight="400" fill="#6f6f6d" text-anchor="start">듣고 난 뒤</text><rect x="40" y="706" width="1520" height="66" rx="14" fill="#f4f4f3"/><text x="800" y="749" font-size="25" font-weight="400" fill="#161616" text-anchor="middle">LLM은 <tspan font-weight="700">말 → 숫자</tspan> 변환만 맡고, <tspan font-weight="700">곡 순서는 수식</tspan>이 정한다  →  추천을 설명하고 검증할 수 있다</text><rect x="40" y="92" width="199.9" height="29.8" rx="14.875" fill="#ffffff" stroke="#d8d8d6" stroke-width="1.5"/><text x="139.9" y="113" font-size="17" font-weight="600" fill="#6f6f6d" text-anchor="middle">Gemini = AI 활용 지점</text></svg>
