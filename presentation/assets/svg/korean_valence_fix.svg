<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="korean_valence_fix-t korean_valence_fix-d" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" class="azt-fig" data-fig="korean_valence_fix"><title id="korean_valence_fix-t">가사를 더해 한국 곡 감정 정확도를 높이다</title><desc id="korean_valence_fix-d">팀 골드셋과의 순위 상관: 전체 곡 Spotify만 0.399 → 가사 결합 0.495, 한국 곡 0.323 → 0.474. 해외 곡은 Spotify만으로 0.764. 보정식 V = 0.2466 + 0.3074×V(Spotify) + 0.3183×V(가사).</desc><defs><marker id="korean_valence_fix-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b5b5b1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="korean_valence_fix-arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="korean_valence_fix-arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#E8763C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="korean_valence_fix-arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3F68D1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><line x1="130" y1="640" x2="840" y2="640" stroke="#d8d8d6" stroke-width="2" stroke-linecap="butt"/><text x="116" y="646" font-size="18" font-weight="400" fill="#9a9a97" text-anchor="end">0.0</text><line x1="130" y1="515" x2="840" y2="515" stroke="#ecebe9" stroke-width="1.5" stroke-linecap="butt"/><text x="116" y="521" font-size="18" font-weight="400" fill="#9a9a97" text-anchor="end">0.2</text><line x1="130" y1="390" x2="840" y2="390" stroke="#ecebe9" stroke-width="1.5" stroke-linecap="butt"/><text x="116" y="396" font-size="18" font-weight="400" fill="#9a9a97" text-anchor="end">0.4</text><line x1="130" y1="265" x2="840" y2="265" stroke="#ecebe9" stroke-width="1.5" stroke-linecap="butt"/><text x="116" y="271" font-size="18" font-weight="400" fill="#9a9a97" text-anchor="end">0.6</text><line x1="130" y1="140" x2="840" y2="140" stroke="#ecebe9" stroke-width="1.5" stroke-linecap="butt"/><text x="116" y="146" font-size="18" font-weight="400" fill="#9a9a97" text-anchor="end">0.8</text><line x1="130" y1="162.5" x2="840" y2="162.5" stroke="#b5b5b1" stroke-width="2" stroke-linecap="butt"/><text x="840" y="150.5" font-size="19" font-weight="400" fill="#6f6f6d" text-anchor="end">해외 곡 (Spotify 값만) 0.764</text><path d="M236 640V398.6Q236 390.6 244 390.6H300Q308 390.6 308 398.6V640Z" fill="#c9c9c5"/><path d="M332 640V338.6Q332 330.6 340 330.6H396Q404 330.6 404 338.6V640Z" fill="#E8763C"/><text x="272" y="376.6" font-size="24" font-weight="700" fill="#6f6f6d" text-anchor="middle">0.399</text><text x="368" y="316.6" font-size="26" font-weight="800" fill="#161616" text-anchor="middle">0.495</text><text x="320" y="680" font-size="26" font-weight="700" fill="#161616" text-anchor="middle">전체 곡</text><text x="320" y="714" font-size="22" font-weight="700" fill="#C9581F" text-anchor="middle">+0.096</text><path d="M566 640V446.1Q566 438.1 574 438.1H630Q638 438.1 638 446.1V640Z" fill="#c9c9c5"/><path d="M662 640V351.8Q662 343.8 670 343.8H726Q734 343.8 734 351.8V640Z" fill="#E8763C"/><text x="602" y="424.1" font-size="24" font-weight="700" fill="#6f6f6d" text-anchor="middle">0.323</text><text x="698" y="329.8" font-size="26" font-weight="800" fill="#161616" text-anchor="middle">0.474</text><text x="650" y="680" font-size="26" font-weight="700" fill="#161616" text-anchor="middle">한국 곡</text><text x="650" y="714" font-size="22" font-weight="700" fill="#C9581F" text-anchor="middle">+0.151</text><rect x="130" y="84" width="18" height="18" rx="4" fill="#c9c9c5"/><text x="158" y="100" font-size="21" font-weight="400" fill="#161616" text-anchor="start">Spotify 값만</text><rect x="330" y="84" width="18" height="18" rx="4" fill="#E8763C"/><text x="358" y="100" font-size="21" font-weight="400" fill="#161616" text-anchor="start">가사 결합 보정식</text><rect x="920" y="84" width="640" height="640" rx="20" fill="#fafaf9" stroke="#e4e4e2" stroke-width="1.5"/><text x="956" y="136" font-size="22" font-weight="700" fill="#6f6f6d" text-anchor="start">보정식 (회귀분석)</text><text x="956" y="192" font-size="30" font-weight="700" fill="#161616" text-anchor="start"><tspan x="956" dy="0">V = 0.2466</tspan><tspan x="956" dy="42">   + 0.3074 × V(Spotify)</tspan><tspan x="956" dy="42">   + 0.3183 × V(가사 · Gemini)</tspan></text><line x1="956" y1="330" x2="1524" y2="330" stroke="#e4e4e2" stroke-width="1.5" stroke-linecap="round"/><text x="956" y="378" font-size="22" font-weight="700" fill="#6f6f6d" text-anchor="start">최종 V를 정하는 순서</text><circle cx="974" cy="420" r="15" fill="#161616"/><text x="974" y="425.8" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="1002" y="428" font-size="23" font-weight="400" fill="#161616" text-anchor="start">사람이 직접 태깅한 곡  <tspan fill="#9a9a97">→ 사람 값</tspan></text><circle cx="974" cy="470" r="15" fill="#161616"/><text x="974" y="475.8" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="1002" y="478" font-size="23" font-weight="400" fill="#161616" text-anchor="start">가사 점수가 있는 곡  <tspan fill="#9a9a97">→ 보정식</tspan></text><circle cx="974" cy="520" r="15" fill="#161616"/><text x="974" y="525.8" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="1002" y="528" font-size="23" font-weight="400" fill="#161616" text-anchor="start">나머지 곡  <tspan fill="#9a9a97">→ Spotify 값</tspan></text><line x1="956" y1="586" x2="1524" y2="586" stroke="#e4e4e2" stroke-width="1.5" stroke-linecap="round"/><text x="956" y="630" font-size="21" font-weight="400" fill="#6f6f6d" text-anchor="start"><tspan x="956" dy="0">한국 대학생은 가사를 이해하며 듣는다 —</tspan><tspan x="956" dy="31.5">멜로디가 밝아도 가사가 슬프면 슬픈 곡으로 느낀다</tspan></text><text x="40" y="772" font-size="19" font-weight="400" fill="#9a9a97" text-anchor="start">팀 골드셋(팀원 4인 판정)과의 순위 상관(Spearman) · 1에 가까울수록 사람이 느끼는 감정과 일치 · 해외 곡 비교 표본은 8곡</text></svg>
