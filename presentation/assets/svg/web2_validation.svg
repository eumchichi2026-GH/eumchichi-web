<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="web2_validation-t web2_validation-d" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" class="azt-fig" data-fig="web2_validation"><title id="web2_validation-t">ver2 검증 — 합성 사용자 시뮬레이션</title><desc id="web2_validation-d">수용 기준 65개 중 52개 합격(1차 49개), 단위 시험 177/177, 회귀 1,959 시나리오 일치, 추천 재현 140/140. P1은 속도를 응답 2번 만에 학습했지만 들려준 적 없는 재즈는 배우지 못했고, P2는 연주곡 비율이 2/8에서 8/8로 올랐다.</desc><defs><marker id="web2_validation-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b5b5b1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="web2_validation-arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="web2_validation-arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#E8763C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="web2_validation-arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3F68D1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="26" width="558.5" height="33.3" rx="16.625" fill="#FDF3EC" stroke="#E8763C" stroke-width="1.5"/><text x="319.2" y="49.5" font-size="19" font-weight="700" fill="#C9581F" text-anchor="middle">합성 사용자 시뮬레이션 결과 · 실사용 효과는 로그가 쌓인 뒤 측정</text><rect x="40" y="90" width="500" height="230" rx="20" fill="#fafaf9" stroke="#e4e4e2" stroke-width="1.5"/><circle cx="140" cy="205" r="72" fi