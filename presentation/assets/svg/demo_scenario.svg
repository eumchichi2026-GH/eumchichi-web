<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="demo_scenario-t demo_scenario-d" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" class="azt-fig" data-fig="demo_scenario"><title id="demo_scenario-t">시연 시나리오</title><desc id="demo_scenario-d">문장 입력 → Gemini 해석(긴장돼요 → 차분해지고 싶어요) → ISO 경로 8곡과 이번 추천에 반영된 나 → 기본 추천과 비교. 오른쪽 QR은 기본 앱 주소(eumchichi-web.vercel.app — ver2).</desc><defs><marker id="demo_scenario-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b5b5b1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="demo_scenario-arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="demo_scenario-arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#E8763C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="demo_scenario-arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3F68D1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="70" font-size="30" font-weight="800" fill="#161616" text-anchor="start">지금부터 시연</text><line x1="84" y1="150" x2="84" y2="600" stroke="#d8d8d6" stroke-width="3" stroke-linecap="round"/><circle cx="84" cy="150" r="26" fill="#161616"/><text x="84" y="157.9" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="134" y="160" font-size="30" font-weight="800" fill="#161616" text-anchor="start">문장 한 줄 입력</text><text x="134" y="206" font-size="22" font-weight="400" fill="#6f6f6d" text-anchor="start">“내일 발표라 너무 떨리고 긴장돼요. 차분해지고 싶어요.”</text><circle cx="84" cy="300" r="26" fill="#161616"/><text x="84" y="307.9" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="134" y="310" font-size="30" font-weight="800" fill="#161616" text-anchor="start">Gemini가 읽기</text><text x="134" y="356" font-size="22" font-weight="400" fill="#6f6f6d" text-anchor="start">지금: 긴장돼요 (아주)  →  목표: 차분해지고 싶어요</text><circle cx="84" cy="450" r="26" fill="#161616"/><text x="84" y="457.9" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="134" y="460" font-size="30" font-weight="800" fill="#161616" text-anchor="start">ISO 경로 8곡</text><text x="134" y="506" font-size="22" font-weight="400" fill="#6f6f6d" text-anchor="start">격정에서 시작해 차분으로 · 감정 변화 지도에 경로 표시</text><circle cx="84" cy="600" r="26" fill="#E8763C"/><text x="84" y="607.9" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="134" y="610" font-size="30" font-weight="800" fill="#161616" text-anchor="start">나에게 맞춤</text><text x="134" y="656" font-size="22" font-weight="400" fill="#6f6f6d" text-anchor="start">‘기본 추천과 비교’ — 8곡 중 7곡이 내 기록으로 바뀜 (예시)</text><rect x="1130" y="110" width="400" height="520" rx="24" fill="#ffffff" stroke="#e4e4e2" stroke-width="2"/><svg x="1170" y="150" width="320" height="320" viewBox="0 0 37 37" shape-rendering="crispEdges"><rect width="37" height="37" fill="#ffffff"/><path d="M4 4h7v1h-7zM12 4h2v1h-2zM15 4h1v1h-1zM17 4h3v1h-3zM21 4h1v1h-1zM26 4h7v1h-7zM4 5h1v1h-1zM10 5h1v1h-1zM12 5h3v1h-3zM17 5h3v1h-3zM21 5h1v1h-1zM23 5h2v1h-2zM26 5h1v1h-1zM32 5h1v1h-1zM4 6h1v1h-1zM6 6h3v1h-3zM10 6h1v1h-1zM12 6h2v1h-2zM15 6h4v1h-4zM22 6h1v1h-1zM24 6h1v1h-1zM26 6h1v1h-1zM28 6h3v1h-3zM32 6h1v1h-1zM4 7h1v1h-1zM6 7h3v1h-3zM10 7h1v1h-1zM13 7h1v1h-1zM15 7h1v1h-1zM18 7h2v1h-2zM21 7h1v1h-1zM23 7h2v1h-2zM26 7h1v1h-1zM28 7h3v1h-3zM32 7h1v1h-1zM4 8h1v1h