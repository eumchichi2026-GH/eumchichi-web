<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="engine_reeval45-t engine_reeval45-d" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" class="azt-fig" data-fig="engine_reeval45"><title id="engine_reeval45-t">실제 요청 45건으로 엔진 다시 평가 (v1 → 개선판)</title><desc id="engine_reeval45-d">목표 도착 오차 0.058 → 0.036 (−38%), 거꾸로 가는 곡 12.2% → 7.7% (−37%), 가장 큰 곡 간 변화 0.209 → 0.189 (−10%). 빔 서치 도입으로 도착 오차 −63%, 최근 곡 제외로 반복 추천 20% → 0%.</desc><defs><marker id="engine_reeval45-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b5b5b1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="engine_reeval45-arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="engine_reeval45-arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#E8763C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="engine_reeval45-arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3F68D1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="60" width="480" height="500" rx="20" fill="#fafaf9" stroke="#e4e4e2" stroke-width="1.5"/><text x="72" y="122" font-size="30" font-weight="800" fill="#161616" text-anchor="start">목표 도착 오차</text><text x="72" y="160" font-size="20" font-weight="400" fill="#6f6f6d" text-anchor="start">낮을수록 목표에 정확히 도착</text><text x="72" y="282" font-size="92" font-weight="800" fill="#161616" text-anchor="start">−38%</text><text x="72" y="378" font-size="22" font-weight="400" fill="#6f6f6d" text-anchor="start">v1</text><path d="M160 352H402Q410 352 410 360V382Q410 390 402 390H160Z" fill="#c9c9c5"/><text x="424" y="380" font-size="22" font-weight="700" fill="#6f6f6d" text-anchor="start">0.058</text><text x="72" y="458" font-size="22" font-weight="700" fill="#161616" text-anchor="start">개선판</text><path d="M160 432H307.2Q315.2 432 315.2 440V462Q315.2 470 307.2 470H160Z" fill="#E8763C"/><text x="329.2" y="460" font-size="24" font-weight="800" fill="#161616" text-anchor="start">0.036</text><rect x="560" y="60" width="480" height="500" rx="20" fill="#fafaf9" stroke="#e4e4e2" stroke-width="1.5"/><text x="592" y="122" font-size="30" font-weight="800" fill="#161616" text-anchor="start">거꾸로 가는 곡</text><text x="592" y="160" font-size="20" font-weight="400" fill="#6f6f6d" text-anchor="start">목표 반대로 움직인 곡의 비율</text><text x="592" y="282" font-size="92" font-weight="800" fill="#161616" text-anchor="start">−37%</text><text x="592" y="378" font-size="22" font-weight="400" fill="#6f6f6d" text-anchor="start">v1</text><path d="M680 352H922Q930 352 930 360V382Q930 390 922 390H680Z" fill="#c9c9c5"/><text x="944" y="380" font-size="22" font-weight="700" fill="#6f6f6d" text-anchor="start">12.2%</text><text x="592" y="458" font-size="22" font-weight="700" fill="#161616" text-anchor="start">개선판</text><path d="M680 432H829.8Q837.8 432 837.8 440V462Q837.8 470 829.8 470H680Z" fill="#E8763C"/><text x="851.8" y="460" font-size="24" font-weight="800" fill="#161616" text-anchor="start">7.7%</text><rect x="1080" y="60" width="480" height="500" rx="20" fill="#fafaf9" stroke="#e4e4e2" stroke-width="1.5"/><text x="1112" y="122" font-size="30" font-weight="800" fill="#161616" text-anchor="start">가장 큰 곡 간 변화</text><text x="1112" y="160" font-size="20" font-weight="400" fill="#6f6f6d" text-anchor="start">곡이 바뀔 때 분위기가 튄 정도</text><text x="1112" y="282" font-size="92" font-weight="800" fill="#16