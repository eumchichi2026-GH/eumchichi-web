<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" role="img" aria-labelledby="cover_path-t cover_path-d" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" class="azt-fig" data-fig="cover_path"><title id="cover_path-t">AZT 표지 그래픽 — 지금에서 목표로 가는 음악 경로</title><desc id="cover_path-d">감정 좌표 평면 위에서 지금(긴장)에서 목표(차분)까지 8곡이 이어지는 경로가 그려진다. 개념도.</desc><style>
    .cover_path-path{stroke-dasharray:1;stroke-dashoffset:0;animation:cover_path-draw 2.4s cubic-bezier(.3,.7,.3,1) .3s both}
    .cover_path-dot{transform-box:fill-box;transform-origin:center;animation:cover_path-pop .45s ease-out both}
    @keyframes cover_path-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @keyframes cover_path-pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
