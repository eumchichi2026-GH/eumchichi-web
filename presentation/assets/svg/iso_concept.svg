<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="iso_concept-t iso_concept-d" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif" class="azt-fig" data-fig="iso_concept"><title id="iso_concept-t">비슷한 곡 나열 vs 지금에서 목표로 가는 순서</title><desc id="iso_concept-d">기존 추천은 지금 기분 근처의 비슷한 곡만 이어져 기분이 그대로다. AZT는 지금 기분과 같은 곡에서 시작해 목표 분위기로 조금씩 옮겨 가고 목표에 머문다. 예시 좌표 개념도.</desc><defs><marker id="iso_concept-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b5b5b1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="iso_concept-arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="iso_concept-arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#E8763C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="iso_concept-arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3F68D1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="iso_concept-g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBE3D8"/><stop offset=".55" stop-color="#F3EEF0"/><stop offset="1" stop-color="#DDEDE4"/></linearGradient><linearGradient id="iso_concept-g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBE3D8"/><stop offset=".55" stop-color="#F3EEF0"/><stop offset="1" stop-color="#DDEDE4"/></linearGradient></defs><text x="40" y="70" font-size="30" font-weight="700" fill="#6f6f6d" text-anchor="start">기존 추천 · 비슷한 곡 나열</text><rect x="40" y="100" width="720" height="580" rx="22" fill="url(#iso_concept-g0)"/><line x1="400" y1="124" x2="400" y2="656" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/><line x1="64" y1="390" x2="736" y2="390" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/><text x="66" y="142" font-size="20" font-weight="400" fill="#6f6f6d" text-anchor="start">긴장 · 불안</text><text x="734" y="142" font-size="20" font-weight="400" fill="#6f6f6d" text-anchor="end">신남 · 활기</text><text x="66" y="656" font-size="20" font-weight="400" fill="#6f6f6d" text-anchor="start">우울 · 무기력</text><text x="734" y="656" font-size="20" font-weight="400" fill="#6f6f6d" text-anchor="end">편안 · 차분</text><text x="400" y="714" font-size="19" font-weight="400" fill="#9a9a97" text-anchor="middle">← 기분 낮음   ·   기분 높음 →</text><circle cx="458" cy="478" r="18" fill="none" stroke="#161616" stroke-width="4" opacity="0.35"/><text x="458" y="528" font-size="22" font-weight="700" fill="#161616" text-anchor="middle" opacity="0.4">목표</text><circle cx="226" cy="240.4" r="12" fill="#161616" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/><circle cx="272.4" cy="200.8" r="12" fill="#161616" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/><circle cx="289.8" cy="236" r="12" fill="#161616" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/><circle cx="237.6" cy="192" r="12" fill="#161616" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/><circle cx="202.8" cy="222.8" r="12" fill="#161616" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/><circle cx="260.8" cy="258" r="12" fill="#161616" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/><circle cx="301.4" cy="209.6" r="12" fill="#161616" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/><circle cx="249.2" cy="275.6" r="12" fill="#161616" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/><circle cx="252.1" cy="218.4" r="15" fill="#E8763C" stroke="#ffffff" stroke-width="3"/><text x="326.1" y="178.4" font-size="22" font-weight="700" fill="#161616" text-anchor="start">지금 · 긴장돼요</text><rect x="420" y="236" width="320" height="96" rx="14" fill="#ffffff" opacity="0.92"/><text x="446" y="276" font-size="23" font-weight="400" fill="#161616" text-anchor="start"><tspan x="446" dy="0">비슷한 곡만 계속 이어져서</tspan><tspan x="446" dy="32.2"><tspan font-weight="700">기분은 그대로</tspan></tspan></text><line x1="418" y1="284" x2="318.1" y2="248.4" stroke="#b5b5b1" stroke-width="2" stroke-linecap="round" marker-end="url(#iso_concept-arr)"/><rect x="840" y="46" width="8" height="32" rx="3" fill="#E8763C"/><text x="862" y="70" font-size="30" font-weight="700" fill="#161616" text-anchor="start">AZT · 지금 → 목표로 가는 순서</text><rect x="840" y="100" width="720" height="580" rx="22" fill="url(#iso_concept-g1)"/><line x1="1200" y1="124" x2="1200" y2="656" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/><line x1="864" y1="390" x2="1536" y2="390" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/><text x="866" y="142" font-size="20" font-weight="400" fill="#6f6f6d" text-anchor="start">긴장 · 불안</text><text x="1534" y="142" font-size="20" font-weight="400" fill="#6f6f6d" text-anchor="end">신남 · 활기</text><text x="866" y="656" font-size="20" font-weight="400" fill="#6f6f6d" text-anchor="start">우울 · 무기력</text><text x="1534" y="656" font-size="20" font-weight="400" fill="#6f6f6d" text-anchor="end">편안 · 차분</text><text x="1200" y="714" font-size="19" font-weight="400" fill="#9a9a97" text-anchor="middle">← 기분 낮음   ·   기분 높음 →</text><path d="M1008.6 205.2 C1013.4 209.6 1027.9 222.8 1037.6 231.6 C1047.3 240.4 1056 246.3 1066.6 258 C1077.2 269.7 1088.8 286.6 1101.4 302 C1114 317.4 1128.5 335 1142 350.4 C1155.5 365.8 1170 381.2 1182.6 394.4 C1195.2 407.6 1204.8 419 1217.4 429.6 C1230 440.2 1244.5 449 1258 458.2 C1271.5 467.4 1291.8 480.2 1298.6 484.6" fill="none" stroke="#E8763C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1298.6" cy="484.6" r="30" fill="none" stroke="#161616" stroke-width="4"/><text x="1342.6" y="538.6" font-size="22" font-weight="700" fill="#161616" text-anchor="start">목표 · 차분해지고 싶어요</text><circle cx="1008.6" cy="205.2" r="15" fill="#E8763C" stroke="#ffffff" stroke-width="3"/><text x="1034.6" y="183.2" font-size="22" font-weight="700" fill="#161616" text-anchor="start">지금 · 긴장돼요</text><circle cx="1037.6" cy="231.6" r="16" fill="#161616" stroke="#ffffff" stroke-width="3"/><text x="1037.6" y="237.6" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><circle cx="1066.6" cy="258" r="16" fill="#161616" stroke="#ffffff" stroke-width="3"/><text x="1066.6" y="264" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><circle cx="1101.4" cy="302" r="16" fill="#161616" stroke="#ffffff" stroke-width="3"/><text x="1101.4" y="308" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><circle cx="1142" cy="350.4" r="16" fill="#161616" stroke="#ffffff" stroke-width="3"/><text x="1142" y="356.4" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><circle cx="1182.6" cy="394.4" r="16" fill="#161616" stroke="#ffffff" stroke-width="3"/><text x="1182.6" y="400.4" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><circle cx="1217.4" cy="429.6" r="16" fill="#161616" stroke="#ffffff" stroke-width="3"/><text x="1217.4" y="435.6" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><circle cx="1258" cy="458.2" r="16" fill="#161616" stroke="#ffffff" stroke-width="3"/><text x="1258" y="464.2" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><circle cx="1298.6" cy="484.6" r="16" fill="#161616" stroke="#ffffff" stroke-width="3"/><text x="1298.6" y="490.6" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">8</text><line x1="1128.6" y1="258" x2="1086.6" y2="262" stroke="#b5b5b1" stroke-width="1.5" stroke-linecap="round"/><text x="1136.6" y="266" font-size="21" font-weight="400" fill="#161616" text-anchor="start">① 지금 기분과 같은 곡으로 시작</text><line x1="1204" y1="350.4" x2="1162" y2="354.4" stroke="#b5b5b1" stroke-width="1.5" stroke-linecap="round"/><text x="1212" y="358.4" font-size="21" font-weight="400" fill="#161616" text-anchor="start">② 조금씩 목표 쪽으로</text><line x1="1279.4" y1="429.6" x2="1237.4" y2="433.6" stroke="#b5b5b1" stroke-width="1.5" stroke-linecap="round"/><text x="1287.4" y="437.6" font-size="21" font-weight="400" fill="#161616" text-anchor="start">③ 목표 분위기에 머묾</text><text x="40" y="770" font-size="19" font-weight="400" fill="#9a9a97" text-anchor="start">음악치료의 ISO(동질성) 원리를 감정 좌표 위 경로 탐색 문제로 바꿨다 · 개념도 (예시: ‘긴장돼요’ → ‘차분해지고 싶어요’)</text></svg>
